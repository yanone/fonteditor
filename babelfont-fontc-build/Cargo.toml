[package]
name = "babelfont-fontc-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
babelfont = { git = "https://github.com/simoncozens/babelfont-rs.git", rev = "0c4a3ea7fb6ae5fa46ad9a1b9778f8fec8055ad5", features = ["fontir", "glyphs", "ufo", "fontlab"] }
typeshare = "1.0"
kurbo = "0.13"
fontdrasil = { git = "https://github.com/simoncozens/fontc", branch = "new-varc-writefonts" }
wasm-bindgen = "0.2"
serde_json = "1.0"
console_error_panic_hook = "0.1"
tempfile = "3"
js-sys = "0.3.83"
write-fonts = "0.45"
read-fonts = "0.37"
skrifa = "0.28"
smol_str = "0.3"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[profile.release]
opt-level = "z"
lto = true
