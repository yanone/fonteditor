<!DOCTYPE html>
<html>
<head>
    <title>Transform Test</title>
</head>
<body>
    <h1>Transform Calculation Test</h1>
    <canvas id="canvas" width="600" height="400" style="border: 1px solid black"></canvas>
    
    <script type="module">
        // Replicate our transform calculation
        function composeTransforms(...transforms) {
            return transforms.reduce(
                (acc, t) => {
                    const [a1, b1, c1, d1, e1, f1] = acc;
                    const [a2, b2, c2, d2, e2, f2] = t;
                    return [
                        a1 * a2 + c1 * b2,
                        b1 * a2 + d1 * b2,
                        a1 * c2 + c1 * d2,
                        b1 * c2 + d1 * d2,
                        a1 * e2 + c1 * f2 + e1,
                        b1 * e2 + d1 * f2 + f1
                    ];
                },
                [1, 0, 0, 1, 0, 0]
            );
        }

        function toAffine(decomposed) {
            const translation = decomposed.translation || [0, 0];
            const scale = decomposed.scale || [1, 1];
            const rotation = decomposed.rotation || 0;
            const skew = decomposed.skew || [0, 0];
            const order = decomposed.order || 'RestOfTheWorld';

            const translateMatrix = [1, 0, 0, 1, translation[0], translation[1]];
            const rotateMatrix = [
                Math.cos(rotation),
                Math.sin(rotation),
                -Math.sin(rotation),
                Math.cos(rotation),
                0,
                0
            ];
            const scaleMatrix = [scale[0], 0, 0, scale[1], 0, 0];
            const skewMatrix = [1, Math.tan(skew[1]), Math.tan(skew[0]), 1, 0, 0];

            if (order === 'Glyphs') {
                // Glyphs order: translate → skew → rotate → scale
                return composeTransforms(
                    translateMatrix,
                    skewMatrix,
                    rotateMatrix,
                    scaleMatrix
                );
            } else {
                // RestOfTheWorld order: translate → rotate → scale → skew
                return composeTransforms(
                    translateMatrix,
                    rotateMatrix,
                    scaleMatrix,
                    skewMatrix
                );
            }
        }

        // Test case: simple translation
        const transform1 = {
            translation: [100, 50],
            order: 'Glyphs'
        };

        const result1 = toAffine(transform1);
        console.log('Simple translation (100, 50):');
        console.log('  Expected: [1, 0, 0, 1, 100, 50]');
        console.log('  Got:      [' + result1.join(', ') + ']');

        // Draw visualization
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Original square
        ctx.strokeStyle = 'blue';
        ctx.strokeRect(10, 10, 50, 50);
        
        // Transformed square
        ctx.save();
        const [a, b, c, d, tx, ty] = result1;
        ctx.transform(a, b, c, d, tx, ty);
        ctx.strokeStyle = 'red';
        ctx.strokeRect(10, 10, 50, 50);
        ctx.restore();
        
        // Test case 2: Translation + rotation
        const transform2 = {
            translation: [200, 100],
            rotation: Math.PI / 4, // 45 degrees
            order: 'Glyphs'
        };
        
        const result2 = toAffine(transform2);
        console.log('\nTranslation (200, 100) + 45° rotation:');
        console.log('  Got: [' + result2.map(v => v.toFixed(3)).join(', ') + ']');
        
        // Draw rotated square
        ctx.save();
        const [a2, b2, c2, d2, tx2, ty2] = result2;
        ctx.transform(a2, b2, c2, d2, tx2, ty2);
        ctx.strokeStyle = 'green';
        ctx.strokeRect(10, 10, 50, 50);
        ctx.restore();
    </script>
</body>
</html>
