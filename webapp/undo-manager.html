<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undo Manager — Counterpunch</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--background-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
            background: var(--background-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        #font-name {
            font-size: 12px;
            color: var(--text-muted);
            padding: 2px 8px;
            border: 1px solid var(--border-primary);
            border-radius: 3px;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #search-input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            background: var(--background-primary);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--border-active);
        }

        #status {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .filters {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }

        .tag {
            padding: 2px 8px;
            font-size: 11px;
            border-radius: 3px;
            border: 1px solid var(--border-primary);
            background: var(--background-secondary);
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .tag:hover { border-color: var(--border-active); color: var(--text-primary); }
        .tag.active { background: var(--background-tertiary); border-color: var(--border-active); color: var(--text-primary); }

        #change-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .change-entry {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-primary);
            font-size: 13px;
            cursor: default;
        }

        .change-entry:hover { background: var(--background-hover); }

        .change-entry .meta {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 2px;
        }

        .change-entry .time {
            color: var(--text-muted);
            font-size: 11px;
            min-width: 60px;
        }

        .change-entry .badge {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            background: var(--background-tertiary);
            color: var(--text-muted);
            border: 1px solid var(--border-primary);
        }

        .change-entry .badge.op-set { border-color: var(--border-primary); color: var(--text-primary); }
        .change-entry .badge.op-add { border-color: var(--border-primary); color: var(--text-primary); }
        .change-entry .badge.op-remove { border-color: var(--border-primary); color: var(--text-primary); }

        .change-entry .path { color: var(--text-primary); }
        .change-entry .values { color: var(--text-muted); font-size: 12px; }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <h1>Undo Manager</h1>
        <span id="font-name">unsaved</span>
        <input id="search-input" type="text" placeholder="Filter changes..." />
        <span id="status">Connecting...</span>
    </header>
    <div class="filters" id="filters"></div>
    <div id="change-list">
        <div class="empty-state">Waiting for font data...</div>
    </div>
    <script src="js/undo-manager-app.js"></script>
</body>
</html>
